# Site GitHub Pages de la méthode TxR (Jekyll, thème par défaut de GitHub Pages).
title: "TxR, méthode"
url: "https://s-geffroy.github.io"
baseurl: "/txr-methode"
txr_version: "0.6.2"
description: "Noter une piste de ski en technique (T) et résistance (R). Travail de recherche."
lang: fr
theme: jekyll-theme-primer
plugins:
  - jekyll-relative-links
  - jekyll-sitemap
  - jekyll-seo-tag
relative_links:
  enabled: true
  collections: false
# Le README est remplacé par index.md ; les sources des fiches et l'outil ne sont pas des pages.
exclude:
  - README.md
  - fiches/sources/
  - outils/
  - CITATION.cff
  - .zenodo.json
kramdown:
  math_engine: mathjax
