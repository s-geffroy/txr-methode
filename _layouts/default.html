<!DOCTYPE html>
<html lang="{{ site.lang | default: "fr" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <style>
      mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; padding: 0.2em 0; }
      .markdown-body table { display: block; overflow-x: auto; }
    </style>
    <script>
      window.MathJax = { tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"], ["$$", "$$"]] },
                         chtml: { scale: 1.05 } };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      {% if site.title and site.title != page.title %}
      <p><a href="{{ "/" | relative_url }}">{{ site.title }}</a></p>
      {% endif %}

      {{ content }}

      <div class="footer border-top border-gray-light mt-5 pt-3 text-gray">
        <small>TxR, méthode de recherche · textes et figures sous licence
        <a href="https://creativecommons.org/licenses/by/4.0/deed.fr">CC BY 4.0</a> ·
        <a href="https://github.com/s-geffroy/txr-methode">sources sur GitHub</a></small>
      </div>
    </div>
  </body>
</html>
